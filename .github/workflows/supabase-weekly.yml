# 주 1회: Supabase 무료 프로젝트 일시 정지 방지 + 백업. docs/OPERATIONS.md
#
# 필요한 저장소 Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<프로젝트>.supabase.co
#   SUPABASE_ANON_KEY  anon public 키
#   SUPABASE_DB_URL    (선택) 전체 백업용 DB 연결 문자열. 있으면 pg_dump 전체 백업을 만든다.
#
# 공개 데이터(공개 글·코스, 이메일 없음)는 `backup` 브랜치에 JSON으로 커밋한다(main 이 아니라 재배포가 일어나지 않음).
# 전체 백업(멤버 이메일 포함)은 저장소에 커밋하지 않고, 90일 보관되는 Actions 아티팩트로만 남긴다.

name: Supabase weekly

on:
  schedule:
    - cron: '17 18 * * 0'   # 매주 월요일 03:17 (한국 시간)
  workflow_dispatch: {}      # Actions 탭에서 직접 실행할 수도 있다

permissions:
  contents: write

concurrency: supabase-weekly

jobs:
  keepalive-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 설정 확인
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_ANON_KEY Secrets 가 없습니다. docs/OPERATIONS.md 참고"; exit 1
          fi

      - name: 공개 데이터 내려받기 (이 요청이 프로젝트를 '활동 중'으로 유지한다)
        run: |
          mkdir -p out
          for t in public_places public_courses public_course_stops; do
            curl -fsS --retry 3 --retry-delay 10 \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$t?select=*" -o "out/$t.json"
            echo "$t: $(jq length out/$t.json)개"
          done

      - name: backup 브랜치에 커밋
        run: |
          git config user.name "here-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backup >/dev/null; then
            git fetch --depth 1 origin backup && git checkout backup
          else
            git checkout --orphan backup && git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data && cp out/*.json data/
          date -u +%Y-%m-%dT%H:%M:%SZ > data/LAST_RUN
          git add data
          git commit -m "공개 데이터 백업 $(date -u +%Y-%m-%d)" && git push origin backup || echo "바뀐 것 없음"

      - name: 전체 백업 (선택, SUPABASE_DB_URL 이 있을 때만)
        if: env.SUPABASE_DB_URL != ''
        run: |
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL" --schema=public --no-owner --no-privileges' | gzip > full-$(date -u +%Y%m%d).sql.gz
          ls -la full-*.sql.gz

      - name: 전체 백업 보관 (90일)
        if: env.SUPABASE_DB_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-full-backup
          path: full-*.sql.gz
          retention-days: 90
